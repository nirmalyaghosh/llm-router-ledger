[build-system]
# Pinned below 1.27: newer hatchling emits Metadata-Version 2.5
# (PEP 794), which twine rejects and PyPI does not yet accept.
# Revisit once the toolchain catches up.
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-router-ledger"
version = "0.2.2"
description = "Route text and embedding calls across LLM providers, keeping a JSONL ledger of every request and response for offline cost reconciliation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Nirmalya Ghosh", email = "1637161+nirmalyaghosh@users.noreply.github.com" },
]
keywords = [
    "anthropic",
    "azure",
    "deepseek",
    "embeddings",
    "ledger",
    "llm",
    "minimax",
    "ollama",
    "openai",
    "openrouter",
    "qwen",
    "router",
    "tracking",
    "usage",
    "zhipu",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Upper bound at <4 rather than <3 so the pydantic-ai extra is
    # installable: pydantic-ai-slim declares openai>=3.0.0 on every
    # extra that touches the OpenAI SDK. openai 3.x leaves the API
    # surface this package uses unchanged; the major replaces httpx
    # with the httpx2 fork and raises the Python, anyio and pydantic
    # floors, none of which constrain this package.
    "openai>=1.55.0,<4",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
dev = [
    "anthropic>=0.30",
    "mypy>=1.10",
    "pydantic-ai-slim[openai]>=2.34,<3",
    "pytest>=8.0",
    "ruff>=0.5",
    "twine>=5.0",
    "types-pyyaml>=6.0",
]
# The lower bound is the version the RequestUsage field names were
# read from and the mapping in _usage.py was written against.
# Re-verify that mapping before raising it.
pydantic-ai = ["pydantic-ai-slim[openai]>=2.34,<3"]

[project.urls]
Homepage = "https://github.com/nirmalyaghosh/llm-router-ledger"
Issues = "https://github.com/nirmalyaghosh/llm-router-ledger/issues"

[project.scripts]
llm-router-ledger = "llm_router_ledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_router_ledger"]

# Allowlist, not a denylist: anything not named here stays out of the
# sdist, so a new working file cannot leak by default.
[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/examples",
    "/pyproject.toml",
    "/src",
    "/tests",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/llm_router_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that hit real, billed provider APIs; skipped unless LRL_RUN_INTEGRATION is set",
]
