# Sample llm_endpoints.yaml. Copy to your project root as llm_endpoints.yaml and edit.
#
# Most providers below route through the shared OpenAI-compatible adapter.
# `provider: anthropic` uses the native Anthropic Messages API adapter.
# 
# About OpenAI models:
# The same model may appear under several endpoint names, one per
# route. gpt-4.1-nano is configured three ways below, as
# azure-gpt-4.1-nano, openai-gpt-4.1-nano and openrouter-gpt-4.1-nano.
# All three share the OpenAI-compatible adapter but differ in
# credential, base_url and billing party, and the `model` field takes a
# different form in each: an Azure deployment name, an OpenAI model id,
# and an OpenRouter author/slug pair. Ledger rows carry both endpoint
# and provider, so the routes reconcile independently.
#
# Several free and low-cost OpenRouter chat models are included, each
# smoke-verified end-to-end. Two caveats apply. Free models share their
# capacity with everyone else using them, so a call fails with HTTP 429
# when they are busy. A declared
# rate describes one upstream out of many, and the spread exceeds 12x
# on input and 20x on output for a single slug, so reconcile against
# the reported cost field rather than the block below.

defaults:
  timeout_seconds: 60
  max_retries: 3
  retry_backoff_factor: 2.0

endpoints:
  # Anthropic direct (native Messages API).
  anthropic-claude-haiku:
    provider: anthropic
    model: claude-haiku-4-5
    api_key_env: ANTHROPIC_API_KEY

  # Azure OpenAI v1
  # The `model` field is the Azure deployment name, not a model name.
  # Replace <your-resource-name> with your actual Azure resource.
  # One of three configured routes to gpt-4.1-nano. See the file header.
  azure-gpt-4.1-nano:
    provider: azure
    model: gpt-4.1-nano  # Refer to the Azure deployment name
    api_key_env: AZURE_OPENAI_API_KEY
    base_url: https://<your-resource-name>.openai.azure.com/openai/v1/

  # DeepSeek direct.
  deepseek-direct:
    provider: deepseek
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1
    region: cn-hangzhou
    cost:
      input_per_1m: 0.28
      output_per_1m: 1.12
      pricing_url: https://api-docs.deepseek.com/quick_start/pricing
      pricing_checked: 2026-05-01

  # Local LM Studio. No real API key needed; any non-empty string works
  # for LMSTUDIO_API_KEY. Start the server from the Developer tab or with
  # `lms server start --port 1234`; loading a model alone does not start it.
  # The model id is the one GET /v1/models reports, not the display name
  # in the UI. qwen3-4b is what examples/smoke_test_lmstudio.py was
  # verified against.
  #
  # timeout_seconds is well above the 60 second default because a local
  # reasoning model is slow: the verification run spent 1413 of its 1464
  # completion tokens on reasoning and took over eight minutes on CPU.
  # The default times out mid-call, which logs a request with no matching
  # response. Lower it for a non-reasoning model.
  local-lmstudio:
    provider: lmstudio
    model: qwen3-4b
    api_key_env: LMSTUDIO_API_KEY
    base_url: http://localhost:1234/v1
    context_window: 32768
    timeout_seconds: 900

  # Local Ollama. No real API key needed; any non-empty string works for OLLAMA_API_KEY.
  # The model below (qwen2.5vl:3b) is what examples/smoke_test_ollama.py was verified against.
  # Substitute whatever you have pulled via `ollama pull <model>`.
  local-llama:
    provider: ollama
    model: qwen2.5vl:3b
    api_key_env: OLLAMA_API_KEY
    base_url: http://localhost:11434/v1
    context_window: 32768

  # MiniMax direct API. OpenAI-compatible endpoint per
  # https://platform.minimax.io/docs/api-reference/text-openai-api.
  minimax-m2.5:
    provider: minimax
    model: MiniMax-M2.5
    api_key_env: MINIMAX_API_KEY
    base_url: https://api.minimax.io/v1
    context_window: 204800

  # Local LM Studio embeddings, called with create_embeddings() rather
  # than send_message(). Download the model in the Discover tab; the
  # id below is what GET /v1/models reports, not the display name.
  # Qwen3-Embedding-0.6B at Q8_0 is the same model and quantisation
  # Ollama serves below, so the two are directly comparable.
  #
  # LM Studio reports prompt_tokens and total_tokens as zero for
  # embeddings, so rows for this endpoint carry a token count of 0
  # rather than the true figure. It returns no response id either, so
  # provider_response_id is empty, as with Ollama. Nothing is billed,
  # so there is no invoice to reconcile against.
  lmstudio-embed-qwen3-0.6b:
    provider: lmstudio
    model: text-embedding-qwen3-embedding-0.6b
    api_key_env: LMSTUDIO_API_KEY
    base_url: http://localhost:1234/v1
    context_window: 32768
    embedding_dimensions: 1024
    cost:
      input_per_1m: 0.00
      output_per_1m: 0.00

  # Local Ollama embeddings, called with create_embeddings() rather
  # than send_message(). Pull the model first:
  #   ollama pull qwen3-embedding:0.6b
  #
  # cost is declared at 0.00 rather than omitted so the entry has the
  # same shape as a hosted one and the ledger records tokens for both.
  #
  # Ollama returns no response id, so provider_response_id is empty.
  # Nothing is billed, so there is no invoice to reconcile against.
  ollama-embed-qwen3-0.6b:
    provider: ollama
    model: qwen3-embedding:0.6b
    api_key_env: OLLAMA_API_KEY
    base_url: http://localhost:11434/v1
    context_window: 32768
    embedding_dimensions: 1024
    cost:
      input_per_1m: 0.00
      output_per_1m: 0.00
      pricing_url: https://ollama.com/library/qwen3-embedding
      pricing_checked: "2026-08-01"
      pricing_notes: "Runs locally. No API cost."

  # NVIDIA NIM, https://integrate.api.nvidia.com/v1. NIM reports
  # prompt, completion and total tokens only: no cost, no upstream
  # provider, and no reasoning or cache breakdown, so rows from these
  # endpoints carry no usage_details, and no estimated_cost either
  # since no cost block is declared. All four were smoke-verified on
  # 2026-08-31.
  # nvidia/nemotron-3-nano-omni-30b-a3b-reasoning direct from NVIDIA
  # NIM. Accepts image, audio and video on input; the adapter sends
  # text only.
  nvidia-nemotron-3-nano-omni:
    provider: nvidia
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    api_key_env: NVIDIA_API_KEY
    base_url: https://integrate.api.nvidia.com/v1

  # nvidia/nemotron-3-super-120b-a12b direct from NVIDIA NIM.
  nvidia-nemotron-3-super:
    provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
    api_key_env: NVIDIA_API_KEY
    base_url: https://integrate.api.nvidia.com/v1

  # nvidia/nemotron-3.5-content-safety direct from NVIDIA NIM. The same
  # model as openrouter-nemotron-3.5-content-safety-free below, so the
  # two routes reconcile against each other. A safety classifier rather
  # than a general chat model: it answers every prompt with a verdict.
  nvidia-nemotron-3.5-content-safety:
    provider: nvidia
    model: nvidia/nemotron-3.5-content-safety
    api_key_env: NVIDIA_API_KEY
    base_url: https://integrate.api.nvidia.com/v1
    notes: >
      A safety classifier rather than a general chat model: it
      answers every prompt with a verdict, so a SQL question returns
      "User Safety: safe". The same prompt billed 5 completion tokens
      here and 159 through OpenRouter, which additionally reported
      178 reasoning tokens.

  # nvidia/nemotron-3.5-lightning-30b-a3b direct from NVIDIA NIM. The
  # same model as openrouter-nemotron-3.5-lightning-free below. NIM
  # names the parameter count in the model id, OpenRouter does not.
  nvidia-nemotron-3.5-lightning:
    provider: nvidia
    model: nvidia/nemotron-3.5-lightning-30b-a3b
    api_key_env: NVIDIA_API_KEY
    base_url: https://integrate.api.nvidia.com/v1
    notes: >
      The same model through openrouter-nemotron-3.5-lightning-free
      reports a cost of 0 and names Nvidia as the upstream.

  # OpenAI direct. No base_url needed; the OpenAI SDK defaults to
  # https://api.openai.com/v1.
  # One of three configured routes to gpt-4.1-nano. See the file header.
  openai-gpt-4.1-nano:
    provider: openai
    model: gpt-4.1-nano
    api_key_env: OPENAI_API_KEY

  # Qwen direct API (Alibaba Cloud DashScope). International endpoint;
  # use https://dashscope.aliyuncs.com/compatible-mode/v1 for the China
  # endpoint, or a regional MaaS URL if your account uses one. The
  # model below (qwen3.5-plus) is what examples/smoke_test_qwen.py was
  # verified against in 0.1.2; the model must be enabled in your
  # DashScope workspace before the key can call it.
  qwen-direct:
    provider: qwen
    model: qwen3.5-plus
    api_key_env: QWEN_API_KEY
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

  # Zhipu / Z.AI direct (GLM family). OpenAI-compatible endpoint.
  zhipu-glm-4.7-flash:
    provider: zhipu
    model: glm-4.7-flash
    api_key_env: ZHIPU_API_KEY
    base_url: https://api.z.ai/api/paas/v4/
    context_window: 202752

  # Route to deepseek/deepseek-chat model via OpenRouter.
  #
  # `extra_body` is an optional vendor passthrough sent on every call to
  # this endpoint, so model-specific knobs live in config instead of in
  # each caller. Below it turns off reasoning tokens for a model that
  # would otherwise emit (and bill for) them.
  #
  # An extra_body passed to send_message() REPLACES this value outright;
  # the two layers are not merged, so a caller wanting both must combine
  # them itself. `provider: anthropic` ignores extra_body entirely.
  openrouter-deepseek:
    provider: openrouter
    model: deepseek/deepseek-chat
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    extra_body:
      reasoning:
        enabled: false

  # deepseek/deepseek-v4-flash-0731 via OpenRouter.
  openrouter-deepseek-v4-flash:
    provider: openrouter
    model: deepseek/deepseek-v4-flash-0731
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 1310720
    cost:
      input_per_1m: 0.035
      output_per_1m: 0.075
      cache_hit_input_per_1m: 0.008
      pricing_url: https://openrouter.ai/deepseek/deepseek-v4-flash-0731
      pricing_checked: "2026-08-25"
      pricing_notes: >
        28 upstreams, 0.035 to 0.44 in and 0.064 to 1.32 out. The
        declared rate is OpenInference's, the cheapest currently
        serving. Venice bills 0.175 / 0.35, five times the declared
        input rate, so reconcile against the reported cost field.
    notes: >
      The context window varies by upstream, from 131072 to 1310720.
      The figure above is the slug's headline, which only Cloudflare
      offers; most upstreams serve 1048576.

  # Embedding endpoints via OpenRouter, called with create_embeddings()
  # rather than send_message(). All nine verified models are shown, in
  # alphabetical order by endpoint name; dimensions and prices below
  # match the README.
  #
  # output_per_1m is 0.00 throughout: embedding endpoints bill input
  # only and return no completion tokens.
  #
  # embedding_dimensions is the width of the returned vectors, so a
  # vector column or collection can be sized without first making a
  # call. It is not OpenAI's `dimensions` request parameter and does not
  # truncate anything; create_embeddings raises ProviderError if the
  # provider returns a different width.
  openrouter-embed-bge-base-en-v1.5:
    provider: openrouter
    model: baai/bge-base-en-v1.5
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 512
    embedding_dimensions: 768
    cost:
      input_per_1m: 0.005
      output_per_1m: 0.00
      pricing_url: https://openrouter.ai/baai/bge-base-en-v1.5
      pricing_checked: "2026-08-25"
    notes: English only, and the shortest context of the embedding set.

  openrouter-embed-bge-m3:
    provider: openrouter
    model: baai/bge-m3
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 8194
    embedding_dimensions: 1024
    cost:
      input_per_1m: 0.01
      output_per_1m: 0.00
      pricing_url: https://openrouter.ai/baai/bge-m3
      pricing_checked: "2026-08-25"
    notes: Multilingual.

  openrouter-embed-mistral-embed-2312:
    provider: openrouter
    model: mistralai/mistral-embed-2312
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 8192
    embedding_dimensions: 1024
    cost:
      input_per_1m: 0.10
      output_per_1m: 0.00
      pricing_url: https://openrouter.ai/mistralai/mistral-embed-2312
      pricing_checked: "2026-08-25"
    notes: >
      The most expensive of the embedding set, at 10x bge-m3 for the
      same width and context.

  # Free tier, so useful for trying create_embeddings() at no cost.
  openrouter-embed-nemotron-3-1b-free:
    provider: openrouter
    model: nvidia/nemotron-3-embed-1b:free
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 32768
    embedding_dimensions: 2048
    cost:
      input_per_1m: 0.00
      output_per_1m: 0.00
      pricing_url: https://openrouter.ai/nvidia/nemotron-3-embed-1b:free
      pricing_checked: "2026-08-25"
      pricing_notes: "Free tier. Rate limits apply."

  openrouter-embed-pplx-v1-0.6b:
    provider: openrouter
    model: perplexity/pplx-embed-v1-0.6b
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 32000
    embedding_dimensions: 1024
    cost:
      input_per_1m: 0.004
      output_per_1m: 0.00
      pricing_url: https://openrouter.ai/perplexity/pplx-embed-v1-0.6b
      pricing_checked: "2026-08-25"
    notes: Cheapest paid endpoint of the embedding set.

  openrouter-embed-qwen3-4b:
    provider: openrouter
    model: qwen/qwen3-embedding-4b
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 32768
    embedding_dimensions: 2560
    cost:
      input_per_1m: 0.02
      output_per_1m: 0.00
      pricing_url: https://openrouter.ai/qwen/qwen3-embedding-4b
      pricing_checked: "2026-08-25"
      pricing_notes: >
        Priced above qwen3-embedding-8b despite being the smaller
        model. Verified against the model page, not a transcription
        slip.

  openrouter-embed-qwen3-8b:
    provider: openrouter
    model: qwen/qwen3-embedding-8b
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 32768
    embedding_dimensions: 4096
    cost:
      input_per_1m: 0.01
      output_per_1m: 0.00
      pricing_url: https://openrouter.ai/qwen/qwen3-embedding-8b
      pricing_checked: "2026-08-25"
      pricing_notes: >
        Three upstreams, 0.01 to 0.04. The declared rate is the
        cheapest and matches two of them; SiliconFlow bills 4x.
    notes: Widest vector here, and half the price of the 4b.

  openrouter-embed-text-embedding-3-large:
    provider: openrouter
    model: openai/text-embedding-3-large
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 8192
    embedding_dimensions: 3072
    cost:
      input_per_1m: 0.13
      output_per_1m: 0.00
      pricing_url: https://openrouter.ai/openai/text-embedding-3-large
      pricing_checked: "2026-08-25"

  openrouter-embed-text-embedding-3-small:
    provider: openrouter
    model: openai/text-embedding-3-small
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 8192
    embedding_dimensions: 1536
    cost:
      input_per_1m: 0.02
      output_per_1m: 0.00
      pricing_url: https://openrouter.ai/openai/text-embedding-3-small
      pricing_checked: "2026-08-25"

  # Route to openai/gpt-4.1-nano via OpenRouter. One of three
  # configured routes to gpt-4.1-nano. See the file header.
  openrouter-gpt-4.1-nano:
    provider: openrouter
    model: openai/gpt-4.1-nano
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1

  # inclusionai/ling-3.0-flash via OpenRouter.
  openrouter-ling-3.0-flash:
    provider: openrouter
    model: inclusionai/ling-3.0-flash
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 262144
    cost:
      input_per_1m: 0.021
      output_per_1m: 0.063
      cache_hit_input_per_1m: 0.0042
      pricing_url: https://openrouter.ai/inclusionai/ling-3.0-flash
      pricing_checked: "2026-08-25"
      pricing_notes: >
        Three upstream entries, 0.021 to 0.06 in. Novita appears twice
        at different rates. The declared rate is the cheaper Novita
        entry.
    notes: >
      The context window varies by upstream, from 131072 to 262144.

  # Route to xiaomi/mimo-v2.5 via OpenRouter. This is the Quickstart
  # default in the README: a cheap general-purpose model, smoke-verified
  # end-to-end.
  openrouter-mimo-v2.5:
    provider: openrouter
    model: xiaomi/mimo-v2.5
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    cost:
      input_per_1m: 0.14
      output_per_1m: 0.28
      cache_hit_input_per_1m: 0.0028
      pricing_url: https://openrouter.ai/xiaomi/mimo-v2.5
      pricing_checked: "2026-08-25"
      pricing_notes: >
        Five upstreams, 0.119 to 0.400 in and 0.238 to 2.000 out. The
        declared rate is Xiaomi's. Parasail matches it on input and
        output, so Xiaomi is cheapest only once cache reads are
        counted, and the 0.119 shown on the model page is GMICloud,
        deranked. Reconcile
        against the reported cost field, not this block, unless the
        upstream is pinned via extra_body.

  # Alternative: mistralai/mistral-nemo via OpenRouter. An older (released
  # July 2024) but mature and inexpensive OSS model. Useful when cost is
  # the dominant constraint and the workload is simple enough that a
  # mature OSS model suffices.
  openrouter-mistral-nemo:
    provider: openrouter
    model: mistralai/mistral-nemo
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1

  # nvidia/nemotron-3.5-content-safety:free via OpenRouter. A safety
  # classifier rather than a general chat model: it answers every prompt
  # with a verdict, so "What is 17 * 23?" returns "User Safety: safe".
  # Called with send_message(), like any other chat endpoint.
  openrouter-nemotron-3.5-content-safety-free:
    provider: openrouter
    model: nvidia/nemotron-3.5-content-safety:free
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 128000
    cost:
      input_per_1m: 0.00
      output_per_1m: 0.00
      pricing_url: https://openrouter.ai/nvidia/nemotron-3.5-content-safety:free
      pricing_checked: "2026-08-25"
      pricing_notes: >
        Free tier. Capacity is shared with all other users, so 429s
        are common.
    notes: >
      Reports completion_reasoning_tokens above completion_tokens on
      short prompts (178 against 168). Reasoning is
      therefore not a subset of the completion count on this endpoint,
      and the ledger records what the provider reports. It also
      prepends a large classifier template, so prompt_tokens is far
      higher than the submitted text implies.

  # nvidia/nemotron-3.5-lightning:free via OpenRouter. Free, with a 1M
  # context.
  openrouter-nemotron-3.5-lightning-free:
    provider: openrouter
    model: nvidia/nemotron-3.5-lightning:free
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 1000000
    cost:
      input_per_1m: 0.00
      output_per_1m: 0.00
      pricing_url: https://openrouter.ai/nvidia/nemotron-3.5-lightning:free
      pricing_checked: "2026-08-25"
      pricing_notes: >
        Free tier, and the provider reports cost as a genuine 0, not a
        missing field. Capacity is shared with all other users, so
        429s are common.

  # qwen/qwen3.8-27b via OpenRouter. Accepts text, image and video on
  # input; the adapter sends text only.
  openrouter-qwen3.8-27b:
    provider: openrouter
    model: qwen/qwen3.8-27b
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    context_window: 1000000
    cost:
      input_per_1m: 0.35
      output_per_1m: 2.75
      cache_hit_input_per_1m: 0.035
      pricing_url: https://openrouter.ai/qwen/qwen3.8-27b
      pricing_checked: "2026-08-25"
      pricing_notes: >
        Ten upstreams, 0.35 to 0.48 in and 2.55 to 3.4 out. The declared
        rate is Chutes', the cheapest currently serving; CoreWeave
        bills 0.4 / 3.0.
    notes: >
      The context window varies by upstream, from 65500 to 1000000. The
      figure above is Alibaba's, the only upstream offering it; most
      serve 262144.

# Role mappings group endpoints by purpose so scripts can call
# get_role_endpoints(project, role) instead of hard-coding names.
# Deprecated: removed in 0.3.0, replaced by route groups.
roles:
  default:
    quick: local-llama
    capable: openrouter-gpt-4.1-nano
    cheap: openrouter-ling-3.0-flash
